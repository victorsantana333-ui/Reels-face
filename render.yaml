# Optional legacy host; the recommended no-card path is Streamlit Community Cloud.
# No paid service or disk is requested. Render may still require account verification.
services:
  - type: web
    name: reels-face
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start-production.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        sync: false
      - key: REELS_ACCESS_TOKEN
        generateValue: true
